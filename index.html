<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Tracker V9 - Custom Program</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Tracker V9</h1>
      <select id="weekSelector" class="week-select" onchange="changeWeek()"></select>
    </header>

    <div id="auth-shell" class="auth-shell">
      <div class="program-info">
        Connecte-toi pour retrouver tes données sur tous tes appareils.
      </div>
      <div id="sync-section"></div>
      <button id="skip-auth" class="sync-btn" type="button">Continuer en mode local</button>
    </div>

    <div id="app-shell" style="display: none">
      <div id="user-bar" class="user-bar" style="display: none">
        <div class="user-bar__text">
          <div id="user-email"></div>
          <div id="user-code" class="user-bar__dim"></div>
        </div>
        <div class="user-bar__actions">
          <button id="user-login" class="sync-btn primary" type="button">Se connecter</button>
          <button id="user-logout" class="sync-btn danger" type="button">Déconnexion</button>
        </div>
      </div>
      <div id="cycle-info" class="program-info">Chargement...</div>

      <nav class="nav-days">
        <button class="nav-btn active" data-section="lundi" onclick="showSection(event, 'lundi')">
          LUN
        </button>
        <button class="nav-btn" data-section="mardi" onclick="showSection(event, 'mardi')">MAR</button>
        <button class="nav-btn" data-section="mercredi" onclick="showSection(event, 'mercredi')">
          MER
        </button>
        <button class="nav-btn" data-section="jeudi" onclick="showSection(event, 'jeudi')">JEU</button>
        <button class="nav-btn" data-section="vendredi" onclick="showSection(event, 'vendredi')">
          VEN
        </button>
        <button class="nav-btn" data-section="samedi" onclick="showSection(event, 'samedi')">SAM</button>
        <button class="nav-btn" data-section="dimanche" onclick="showSection(event, 'dimanche')">
          DIM
        </button>
        <button class="nav-btn history-btn" data-section="history" onclick="showSection(event, 'history')">
          HISTORIQUE 📈
        </button>
        <button
          class="nav-btn dashboard-btn"
          data-section="dashboard"
          onclick="showSection(event, 'dashboard')"
        >
          DASH ⚙️
        </button>
      </nav>

      <div id="workout-section" class="section-container active"></div>

      <div id="history-section" class="section-container">
        <div class="history-controls">
          <div>
            <div class="history-label">1. Choisir le Jour</div>
            <select id="hist-day-select" class="hist-select" onchange="updateHistExoSelect()">
              <option value="lundi">LUNDI (Upper 1)</option>
              <option value="mardi">MARDI (Lower)</option>
              <option value="jeudi">JEUDI (Dos/Biceps)</option>
              <option value="vendredi">VENDREDI (Épaules/Tri)</option>
              <option value="samedi">SAMEDI (Custom)</option>
              <option value="dimanche">DIMANCHE (Ischios/Lomb)</option>
            </select>
          </div>
          <div>
            <div class="history-label">2. Choisir l'Exercice</div>
            <select
              id="hist-exo-select"
              class="hist-select"
              onchange="updateHistSetSelect()"
            ></select>
          </div>
          <div>
            <div class="history-label">3. Choisir la Série</div>
            <select id="hist-set-select" class="hist-select" onchange="updateHistoryCharts()">
              <option value="0">Série 1</option>
              <option value="1">Série 2</option>
              <option value="2">Série 3</option>
              <option value="3">Série 4</option>
              <option value="4">Série 5</option>
            </select>
          </div>
        </div>

        <div class="chart-container">
          <div class="chart-title chart-title--primary">ÉVOLUTION POIDS (KG)</div>
          <canvas id="weightChart"></canvas>
        </div>
        <div class="chart-container">
          <div class="chart-title chart-title--accent">ÉVOLUTION RÉPÉTITIONS</div>
          <canvas id="repsChart"></canvas>
        </div>
      </div>

      <div id="dashboard-section" class="section-container">
        <div id="dashboard-root"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
