name: Keep Supabase Alive

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 3 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
          -X POST "https://cwalwgecwugfmixxjtgb.supabase.co/rest/v1/rpc/ping" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"